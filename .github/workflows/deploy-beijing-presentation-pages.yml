name: Deploy Beijing Presentation to Pages

on:
  push:
    branches:
      - main
    paths:
      - "beijing-15w-plan-academic-presentation.html"
      - ".github/workflows/deploy-beijing-presentation-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        run: |
          rm -rf _site
          mkdir -p _site
          cp beijing-15w-plan-academic-presentation.html _site/index.html
          cp beijing-15w-plan-academic-presentation.html _site/beijing-15w-plan-academic-presentation.html
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
